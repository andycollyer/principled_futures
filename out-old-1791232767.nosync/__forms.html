<!doctype html>
<!-- Netlify Forms detection.

     Netlify finds forms by scanning the HTML it is given at deploy time. This
     app renders in the browser, so the wait-list form is invisible to that
     scan. This file exists so the form is registered, and the form posts here.
     Keep the field names identical to src/components/landing/WaitlistForm.jsx,
     or submissions will be rejected. -->
<html lang="en-GB">
  <head><meta charset="utf-8" /><title>Forms</title></head>
  <body>
    <form name="pf-waitlist" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="organisation" />
      <input type="text" name="role" />
      <input type="checkbox" name="consent" value="yes" />
    </form>
  </body>
</html>
