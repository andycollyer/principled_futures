<!doctype html>
<!-- Netlify Forms detection.

     Netlify finds forms by scanning the HTML it is given at deploy time. This
     app renders in the browser, so the wait-list form on /welcome/ is invisible
     to that scan. This file exists purely so the form is registered; nobody
     visits it. Keep the field names identical to the real form, or submissions
     will be rejected. -->
<html lang="en-GB">
  <head><meta charset="utf-8" /><title>Forms</title></head>
  <body>
    <form name="pf-waitlist" data-netlify="true" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="org" />
      <input type="text" name="role" />
    </form>
  </body>
</html>
